name: CI Build & Test

on:
  push:
    branches: [ main, dev_duong ]
  pull_request:
    branches: [ main, dev_duong ]
  workflow_dispatch:

jobs:
  dotnet-ci:
    name: .NET 10 (Backend & PortalWeb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Verify .NET SDK
        run: dotnet --info

      - name: Restore NuGet Packages
        run: |
          dotnet restore Backend/Backend.csproj
          dotnet restore Backend.Tests/Backend.Tests.csproj
          dotnet restore PortalWeb/PortalWeb.csproj

      - name: Build Backend
        run: dotnet build Backend/Backend.csproj --no-restore -c Release

      - name: Build PortalWeb
        run: dotnet build PortalWeb/PortalWeb.csproj --no-restore -c Release

      - name: Run Backend Tests
        run: dotnet test Backend.Tests/Backend.Tests.csproj --no-restore -c Release --verbosity normal

  flutter-ci:
    name: Flutter CustomerApp (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install Flutter Dependencies
        working-directory: CustomerApp
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: CustomerApp
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: CustomerApp
        run: flutter test
