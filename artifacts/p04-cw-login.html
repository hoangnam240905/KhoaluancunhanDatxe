<body class="dx-body ax-body">
    
<div class="ax-login">
    <aside class="ax-panel">
        <img src="/images/auth/hero.fkkx2zb97g.jpg" alt="Xe sang DriveX" />
        <div class="ax-panel-inner">
            <a class="ax-brand" href="/">

                DriveX

    <section class="ax-form-col">
        <div class="ax-card">
            <div class="ax-card-top">
                <a class="ax-brand" style="color:#0f1f3d" href="/">
                    <span><i class="bi bi-car-front-fill"></i></span>
                    DriveX
                </a>
                <span class="ax-lang" title="Chỉ hiển thị giao diện tiếng Việt"><i class="bi bi-globe2"></i> Tiếng Việt</span>

            <p class="ax-lead">Đăng nhập để tiếp tục hành trình cùng DriveX.</p>

            

            <form method="post" data-ax-form>
                <input type="hidden" id="ReturnUrl" name="ReturnUrl" value="" />
                <div class="ax-field">
                    <label for="Input_Email">Email</label>
                    <input type="email" placeholder="Nhập email của bạn" autocomplete="username" data-val="true" data-val-email="Email kh&#xF4;ng h&#x1EE3;p l&#x1EC7;." data-val-required="Vui l&#xF2;ng nh&#x1EAD;p email." id="Input_Email" name="Input.Email" value="" />

                </div>
                <div class="ax-field">
                    <label for="Input_Password">Mật khẩu</label>
                    <div class="ax-wrap">
                        <input type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" data-val="true" data-val-required="Vui l&#xF2;ng nh&#x1EAD;p m&#x1EAD;t kh&#x1EA9;u." id="Input_Password" name="Input.Password" />
                        <button type="button" class="ax-toggle" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
                    </div>
                    <span class="field-validation-error field-validation-valid" data-valmsg-for="Input.Password" data-valmsg-replace="true"></span>
                </div>
                <div class="ax-row">
                    <label class="ax-check">
                        <input type="checkbox" />
                        Ghi nhớ đăng nhập
                    </label>
                    <a href="/Account/ForgotPassword">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="ax-submit" data-ax-submit>Đăng nhập</button>
            <input name="__RequestVerificationToken" type="hidden" value="CfDJ8CHU1xc-13xKuVi-vnJsMiiYxSA8MxlYFQslFfNqDZgGomrWUzgGQGKW53YXYtecfi4B3Y5g50YUuHg1JyGyz4NDwVImOmRhbXUeyleBnDGCNvAor_8SBx-op7q4afS5lXtqdjeGs62sIJz9Wi5ftR0" /></form>

            <div class="ax-or">Hoặc đăng nhập với</div>
            <div class="ax-social">
                    <button type="button" class="ax-social-btn" disabled title="Google chưa được cấu hình"><i class="bi bi-google"></i> Google</button>
